        /* CRT Screen Overlay Effects */
        .crt-container {
            position: relative;

        }

        .crt-container::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -10%;
            width: 120%;
            height: 50%;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(85, 214, 255, 0.025),
                rgba(85, 215, 255, 0.158),
                rgba(85, 214, 255, 0.025),
                transparent
            );
            filter: blur(25px);
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            animation: screen-refresh-wave 15s linear infinite;
        }

        @keyframes screen-refresh-wave {
            from { transform: translateY(0); }
            to { transform: translateY(560%); }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.4) 50%

            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.6;

            animation: flicker 5s ease-in-out infinite;
        }

        @keyframes flicker {
            0%   { opacity: 0.60; }
            25%  { opacity: 0.80; }
            50%  { opacity: 1.00; }
            75%  { opacity: 0.70; }
            85%  { opacity: 0.85; }
            100% { opacity: 0.60; }

            const doorDefinition = DOOR_SYSTEM[doorTag.name];
            return doorDefinition ? {
                ...DOOR_RULES,
                ...doorDefinition,
                id: doorTag.name,
                difficulty: doorTag.difficulty,
                outcomes: DOOR_RULES.outcomes
            } : null;

        function getDoorState(door, result) {
            const hasResult = Number.isInteger(result);
            return {
                hasResult,
                isOpen: hasResult && result >= door.difficulty,
                outcome: hasResult ? door.outcomes[result] : ''

                            text: "RAPPORT D'URGENCE – INFIRMERIE CENTRALE\nRédigé par : Infirmière Élodie Varnier\nHorodatage : 19:18\nPatient : Femme, env. 30–35 ans\nAdmission : Vivante / état critique\n\n[CONSTAT À L'ARRIVÉE]\nLa patiente a été amenée consciente, marchant seule, accompagnée à distance par deux membres de la maintenance qui ont refusé de s'approcher davantage, l'ayant déclarée extrêmement violente.\nElle tenait quelque chose contre son abdomen avec les deux mains. Ils pensaient qu'il s'agissait d'un vêtement. Ce n'était pas le cas.\n\n- Plaie abdominale large, ouverte volontairement, incision nette mais irrégulière.\n- Absence d'hémorragie massive immédiate, ce qui est médicalement difficile à expliquer vu l'étendue de la blessure.\n- La patiente avait commencé à extraire ses propres organes. Un segment intestinal était déjà sectionné et maintenu hors de la cavité abdominale, enveloppé grossièrement dans un tissu isolant récupéré sur place.\n- Elle respirait rapidement mais restait étonnamment stable.\n\n[COMPORTEMENT OBSERVÉ]\n- Aucune panique.\n- Aucune plainte liée à la douleur.\n- Elle répétait calmement : \"Ce n'est pas à sa place.\" \"Il faut que ça sorte.\"\n- Lorsqu'on lui a demandé pourquoi, elle a simplement répondu : \"Parce qu'il regarde.\"\n\nElle a refusé toute aide tant que nous tentions de refermer la plaie. Non réponse à la sédation.\nEn revanche, elle a cessé toute résistance lorsque nous avons stabilisé les organes extraits, comme si l'important n'était pas sa survie.\n\n[INTERVENTION]\n- Compression abdominale\n- Tentative de sédation (efficacité partielle)\n- Réchauffement progressif\n\nÀ noter : augmentation brutale de la fréquence cardiaque et de l'agitation lors du réchauffement. La patiente a alors repris l'extraction avec plus de force, utilisant ses ongles et ses dents pour sectionner des tissus déjà fragilisés. Elle pleurait, mais ne criait pas.\n\n[DÉCÈS]\nArrêt cardiaque consécutif à une défaillance multiple des orga (non datée - retrouvée pliée)

J'écris ceci pour tenter de remettre de l'ordre dans mes pensées.

Depuis plusieurs semaines, je fais face à des patients qui arrivent morts ou aux portes de la mort, présentant des mutilations que je n'aurais jamais cru possibles sans perte de conscience immédiate. Ce constat, à lui seul, suffirait à troubler n'importe quel praticien. Pourtant, ce n'est pas la gravité des blessures qui m'inquiète le plus, mais ce qui les précède.

Ces personnes ne se connaissaient pas. Elles n'exerçaient pas les mêmes fonctions. Elles ne partageaient ni croyances communes, ni passés similaires. En apparence, rien ne permet de les relier.

Et pourtant, dès que l'on observe leurs derniers comportements, un motif se dessine. Une convergence inquiétante. Une peur diffuse, une paranoïa grandissante, une obsession d'être observé, jugé, désigné comme fautif.

Je me surprends à envisager une forme de contamination psychique. Pas une pathologie identifiable, ni un agent biologique ; toutes les analyses sont négatives. Mais un phénomène comportemental. Un délire mimétique, peut-être... La peur comme vecteur. La mise en scène des morts comme catalyseur. Une spirale où chaque découverte alimente la suivante.

Le Conseil, de son côté, est incapable de trancher. Ils débattent sans fin, pesant chaque décision comme si le temps n'était pas un facteur critique. Ils veulent des certitudes là où il n'y en a plus. Leur immobilisme me fatigue plus que je ne sache l'admettre à voix haute. Ils ne savent pas quoi faire du nouvel arrivant du fond spatial, mais les problèmes ont commencé avec son arrivée.

Je me surprends à regretter l'époque où cette colonie n'était pas dirigée par un organe aussi fragmenté. Lorsque les dogmes ne régissaient pas la vie ici, tout était plus simple. Brutal, parfois absurde, mais cohérent au final. Aujourd'hui, nous avons remplacé des règles sociales imparfaites par un vide décisionnel.

Je continue de remplir des rapports.

Je continue de signer des certificats de décès.

Mais chaque jour, je comprends un peu moins ce que j'atteste.`,
                        doctorLootNote2: `Lettre personnelle II - Dr. Thomas Becker

(non datée - écriture tremblée, encre appuyée)

Je dois admettre que ce que j'ai écrit précédemment ne me suffit plus.

Les explications rationnelles que je tentais de formuler ne tiennent plus face aux faits récents.

Ce qui se passe sur cette station ne relève plus d'un phénomène de contamination psychique au sens classique. Il y a dans ces morts une intention qui dépasse le simple délire individuel. Les gestes sont trop précis. Trop répétés. Les mises en scène suivent une logique interne que je commence à percevoir sans pouvoir la formuler clairement.

J'ai vu des patients mourir non pas pour fuir la souffrance. Leurs esprits se fragmentent.

Ils parlaient peu, mais leurs regards étaient fixés. Ils ne demandaient pas d'aide.

Ils ne semblaient même plus comprendre ou réagir à la réalité.

Le Conseil est désormais touché à son tour. Les accusations circulent. Les soupçons se cristallisent. Deux membres se sont donné la mort. Peut-être trois, disparu actuellement. Les informations se contredisent, ou sont volontairement dissimulées. Ce qui était censé gouverner la station est devenu une arène silencieuse où chacun redoute d'être le prochain désigné par une accusation. Et toujours rien concernant nos nouveaux pensionnaires... La clef, j'en suis sûr !

La station n'est plus un lieu de soin. Elle s'est transformée en tribunal.

Un tribunal sans juge visible, sans loi écrite, mais dont les sentences sont irrévocables.

Ce qui me terrifie le plus, ce n'est pas la mort.

C'est l'acceptation. Personne ne réclame de défense. Personne ne nie vraiment.

Ils semblent tous persuadés qu'une faute existe, même s'ils ne savent pas laquelle.

Je ne crois plus que la science suffise à expliquer ce que nous vivons.

Je ne crois pas non plus qu'il s'agisse d'un retour au religieux, au sens humain du terme. C'est autre chose. Quelque chose qui observe, qui attend, et qui pousse sans se montrer.

Et j'ai la certitude glaçante que`,

                                text: "SERVICE MÉDICAL – RAPPORTS D'ADMISSION\nMédecin responsable : Dr. Thomas Becker\n\nPatient : Homme, 42 ans\nÉtat à l'arrivée : Décédé\nLieu de découverte : Couloir technique – niveau inférieur\n\n[CONSTAT INITIAL]\nLe corps a été découvert empalé verticalement, à environ deux mètres du sol, fixé sur un renfort structurel du couloir. Aucune trace de lutte dans la zone. Aucune trace de déplacement visible.\n\n[LÉSIONS OBSERVÉES]\n- Multiples lacérations auto-infligées aux avant-bras, au thorax et à l'abdomen.\n- Hémorragies compatibles avec un suicide par exsanguination.\n\n[CAUSE DU DÉCÈS]\nPerte sanguine massive, antérieure à l'empalement. L'empalement a été réalisé après le décès. Les tissus ne présentent aucune réaction inflammatoire. Aucune contraction musculaire réflexe. L'angle de pénétration est précis. La force appliquée est suffisante pour traverser les tissus mous et s'ancrer dans la structure métallique.\n\n[INCOHÉRENCES RELEVÉES]\nLe patient ne pouvait pas, seul, se placer dans cette position après la perte de conscience. Aucune trace de matériel de levage. Aucun témoin. Aucune trace de pas supplémentaires.\n\n[REMARQUES CLINIQUES]\nLes blessures auto-infligées sont compatibles avec les cas précédents. L'empalement ne l'est pas. Il ne s'agit pas d'un accident. Il ne s'agit pas d'une mise en scène spontanée. Quelqu'un… ou quelque chose… a déplacé le corps.",

                                date: "À L'ATTENTION DU CONSEIL ET DES INTENDANTS",
                                text: "NOTE INTERNE - ÉQUIPE TECHNIQUE DE RÉCUPÉRATION\n\nJe rédige cette note parce que personne d'autre ne le fera. Parce que les chiffres ne suffisent pas quand ce sont des visages que l'on enterre.\n\nL'équipe de récupération envoyée sur le vaisseau à la dérive a mené sa mission à terme. Le vaisseau de sauvetage amarré sur la partie supérieure a été ramené. Impossible d'entamer la coque du plus gros navire portant le nom UCS-Horizon.\n\nL'équipage, lui, est resté là-bas... ou presque.\n\nIls étaient cinq à partir.\n\nMorozov, manutentionnaire et soudeur principal, est mort lors des opérations de récupération. Un accident grave. Une erreur de calcul sans doute, une pièce qui a cédé dans le vaisseau de sauvetage. Il n'a pas souffert longtemps. C'est tout ce que je peux écrire sans mentir.\n\nSoren, Martal et Lucien se sont donné la mort pendant le voyage de retour. Je n'entrerai pas dans les détails, mais ils étaient clairement dans un état de déroute. Nous travaillons ensemble depuis assez longtemps pour que je sache reconnaître la honte dans leurs silences. Je pense qu'ils n'ont pas supporté ce qu'ils avaient vu durant l'accident... ou ce qu'ils n'avaient pas vu assez tôt.\n\nEthan Cole, le pilote, est en vie. Il a ramené seul le Lysithea à la station. Il pilotait pendant que les autres se donnaient la mort derrière lui. Il l'ignore encore, parfois. Parfois il le sait trop bien. Il ne dort plus. Il murmure des prénoms à voix basse.\n\nJe demande officiellement l'ouverture d'une cagnotte communautaire pour les familles de Morozov, Kallio, Weiss et Perrin. Ils n'étaient pas des héros. Ils étaient présents chaque jour. Ils faisaient leur travail. Ils méritent que nous portions une part de ce qu'ils ont laissé derrière eux.\n\nNotre dogme nous enseigne que certains fardeaux ne sont pas faits pour être compris, seulement partagés. Que le silence peut être une prière. Et que détourner le regard n'efface rien.\n\nQue ceux qui sont morts reposent dans le froid qu'ils connaissaient. Que ceux qui vivent encore trouvent la force de rester droits.\n\nJarek Havel\nChef technique - Lysithea"

        let currentState = {
            view: 'home',
            currentGlobalKey: null,

        let playerSession = null;
        let gameStateRef = null;

        function normalizePseudo(value) {
            return value.trim().replace(/\s+/g, ' ').slice(0, 24);
        }

        function isMasterPseudo(pseudo) {
            return pseudo.toLocaleLowerCase('fr-FR') === MASTER_NAME.toLocaleLowerCase('fr-FR');
        }

        function updatePlayersDisplay(players) {
            const playerNames = Object.values(players || {})
                .map(player => player.pseudo)
                .filter(Boolean)
                .sort((first, second) => first.localeCompare(second, 'fr'));
            const text = playerNames.length
                ? `JOUEURS CONNECTÉS : ${playerNames.join(' // ')}`
                : 'JOUEURS CONNECTÉS : AUCUN';
            document.getElementById('players-teleprompter').textContent = text;
        }

        function getSharedState() {
            return {
                view: currentState.view,
                currentGlobalKey: currentState.currentGlobalKey,
                currentZoneId: currentState.currentZoneId,
                currentReportId: currentState.currentReportId,
                unlockedLoot: currentState.unlockedLoot,
                doorLevels: currentState.doorLevels,
                doorRetryAt: currentState.doorRetryAt,
                openedZones: currentState.openedZones
            };
        }

        function renderSharedState() {
            if (currentState.view === 'report_detail') {
                openReport(currentState.currentGlobalKey, currentState.currentZoneId, currentState.currentReportId, false);
            } else if (currentState.view === 'zone_detail') {
                openSubZone(currentState.currentGlobalKey, currentState.currentZoneId, false);
            } else if (currentState.view === 'global_zone') {
                openGlobalZone(currentState.currentGlobalKey, false);
            } else {
                showHomeScreen(false);
            }
        }

        function publishGameState() {
            if (gameStateRef && playerSession?.role === 'master') {
                gameStateRef.set(getSharedState());
            }
        }

        function canModifyGame() {
            return playerSession?.role === 'master';
        }

        function watchGameState() {
            if (!gameStateRef || playerSession?.role === 'master') return;
            gameStateRef.on('value', snapshot => {
                const sharedState = snapshot.val();
                if (!sharedState) return;
                currentState = { ...currentState, ...sharedState, lootInputZone: null, doorInputZone: null };
                renderSharedState();
            });
        }

        function registerLocalSession(pseudo) {
            playerSession = { pseudo, role: isMasterPseudo(pseudo) ? 'master' : 'player', uid: `local-${Date.now()}` };
            updatePlayersDisplay({ [playerSession.uid]: playerSession });
            document.getElementById('session-overlay').classList.add('hidden');
        }

        async function connectSession(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const pseudo = normalizePseudo(form.elements.pseudo.value);
            const password = form.elements.password.value;
            const errorElement = document.getElementById('session-error');
            errorElement.textContent = '';

            if (!pseudo) return;
            if (isMasterPseudo(pseudo) && !password) {
                errorElement.textContent = 'MOT DE PASSE REQUIS POUR DIEU.';
                return;
            }

            if (!isFirebaseConfigured) {
                registerLocalSession(pseudo);
                errorElement.textContent = 'MODE LOCAL : FIREBASE N’EST PAS CONFIGURÉ.';
                return;
            }

            try {
                const auth = firebase.auth();
                const credential = isMasterPseudo(pseudo)
                    ? await auth.signInWithEmailAndPassword(MASTER_EMAIL, password)
                    : await auth.signInAnonymously();
                const role = isMasterPseudo(pseudo) ? 'master' : 'player';
                playerSession = { pseudo, role, uid: credential.user.uid };

                const playerRef = firebase.database().ref(`games/${GAME_ID}/players/${playerSession.uid}`);
                await playerRef.set({ pseudo, role, connected: true });
                playerRef.onDisconnect().remove();
                gameStateRef = firebase.database().ref(`games/${GAME_ID}/state`);
                gameStateRef.on('value', snapshot => {
                    if (playerSession.role === 'master') return;
                    const sharedState = snapshot.val();
                    if (!sharedState) return;
                    currentState = { ...currentState, ...sharedState, lootInputZone: null, doorInputZone: null };
                    renderSharedState();
                });
                firebase.database().ref(`games/${GAME_ID}/players`).on('value', snapshot => updatePlayersDisplay(snapshot.val()));
                document.getElementById('session-overlay').classList.add('hidden');
                if (playerSession.role === 'master') publishGameState();
            } catch (error) {
                errorElement.textContent = 'CONNEXION REFUSÉE : VÉRIFIEZ LE PSEUDONYME OU LE MOT DE PASSE.';
            }
        }

        function initializeSession() {
            const form = document.getElementById('session-form');
            const pseudoInput = document.getElementById('session-pseudo');
            const passwordRow = document.getElementById('master-password-row');
            form.addEventListener('submit', connectSession);
            pseudoInput.addEventListener('input', () => {
                passwordRow.classList.toggle('hidden', !isMasterPseudo(normalizePseudo(pseudoInput.value)));
            });
            showHomeScreen(false);
            pseudoInput.focus();

            if (isFirebaseConfigured) {
                firebase.initializeApp(FIREBASE_CONFIG);
            }
        }

        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('system-clock').innerText = `${hrs}:${mins}:${secs} UTC`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function formatCooldown(milliseconds) {
            const totalSeconds = Math.ceil(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function updateDoorCooldowns() {
            document.querySelectorAll('[data-door-cooldown]').forEach((element) => {
                const doorId = element.dataset.doorCooldown;
                const retryAt = currentState.doorRetryAt[doorId] || 0;
                const remaining = retryAt - Date.now();
                const retryButton = document.getElementById(`door-retry-${doorId}`);

                if (remaining > 0) {
                    element.innerText = `NOUVEL ESSAI POSSIBLE DANS ${formatCooldown(remaining)}`;
                    if (retryButton) {
                        retryButton.disabled = true;
                        retryButton.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                } else {
                    element.innerText = 'NOUVEL ESSAI POSSIBLE';
                    if (retryButton) {
                        retryButton.disabled = false;
                        retryButton.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            });
        }

        setInterval(updateDoorCooldowns, 1000);

                                </label>
                                <button type="button" onclick="setDoorLevel('${door.id}')" class="btn-retro px-5 py-2 text-xl font-bold rounded">VALIDER</button>
                                <button type="button" onclick="toggleDoor('${door.id}')" class="btn-retro px-5 py-2 text-xl font-bold rounded">FERMER</button>
                            </div>
                            <p id="door-level-error-${door.id}" class="text-red-400 mt-2 hidden">Veuillez entrer un chiffre entier entre 0 et 5.</p>
                        </div>
                    `;
                }

                return `
                    <div class="amber-border ${hasResult ? 'amber-border-glow' : ''} bg-black p-4 rounded-lg mt-6 text-center">
                        <div class="text-amber-500 mb-2 text-lg">${door.title}</div>
                        ${hasResult ? `<p class="text-amber-200 text-xl mb-3">NIVEAU ${savedLevel}/5 : ${outcome}</p>` : ''}
                        ${hasResult && isDoorOpen ? `
                            <div class="amber-border bg-amber-900 bg-opacity-40 p-3 mt-3 text-amber-200 text-xl">
                                PORTE OUVERTE : vous pouvez cliquer sur le bouton RETOUR pour poursuivre.
                            </div>
                        ` : ''}
                        ${hasResult && !isDoorOpen ? `
                            <div class="amber-border bg-amber-900 bg-opacity-40 p-3 mt-3 text-amber-200 text-xl">
                                PORTE BLOQUEE : elle restera ainsi sans materiel supplementaire ou moyens humains. Revenez plus tard.
                                ${savedLevel === 0 || savedLevel === 1 ? `<div id="door-cooldown-${door.id}" data-door-cooldown="${door.id}" class="text-amber-400 mt-2">NOUVEL ESSAI POSSIBLE DANS ${formatCooldown(Math.max(0, (currentState.doorRetryAt[door.id] || 0) - Date.now()))}</div>` : ''}
                            </div>
                        ` : ''}
                        ${!hasResult || savedLevel === 0 || savedLevel === 1 ? `
                            <button id="door-retry-${door.id}" onclick="toggleDoor('${door.id}')" ${(savedLevel === 0 || savedLevel === 1) && (currentState.doorRetryAt[door.id] || 0) > Date.now() ? 'disabled' : ''} class="btn-retro px-6 py-3 text-xl font-bold rounded-lg hover:scale-105 transform transition-all ${(savedLevel === 0 || savedLevel === 1) && (currentState.doorRetryAt[door.id] || 0) > Date.now() ? 'opacity-50 cursor-not-allowed' : ''}">
                                ${hasResult ? 'REESSAYER LE FORCAGE' : 'FORCER LA PORTE'}
                            </button>
                        ` : ''}
                    </div>
                `;
            };

            const doorSectionHTML = door ? renderDoorPanel(door) : '';

//============================================================================================
// ASSEMBLAGE DES PANNEAUX DE LA ZONE
//============================================================================================
            let lootSectionHTML = '';
            if (!isDoorOpen) {
                lootSectionHTML = `
                    <div class="amber-border bg-black p-4 rounded-lg mt-6 text-center">
                        <p class="text-amber-400 text-xl">L'interieur reste inaccessible tant que la porte n'est pas suffisamment ouverte.</p>
                    </div>
                `;
            } else if (zone.lootGroups) {
                lootSectionHTML = zone.lootGroups.map(group => renderLootPanel(group, `${subZoneId}:${group.id}`)).join('');
            } else {
                const mainLootGroup = { id: 'main', title: 'MATÉRIEL RÉCUPÉRABLE', items: zone.loot };
                lootSectionHTML = renderLootPanel(mainLootGroup, subZoneId);
            }

            let doctorLootSectionHTML = '';
            if (subZoneId === 'inf_d' && Number.isInteger(lootLevel) && lootLevel >= 1) {
                doctorLootSectionHTML = `
                    <div class="amber-border bg-black p-4 rounded-lg mt-4">
                        <div class="text-amber-500 mb-2 text-lg">DOCUMENT DÉBLOQUÉ</div>
                        <button type="button" onclick="toggleDoctorLootNote()" class="btn-retro px-4 py-2 text-xl font-bold rounded">
                            📄 CONSULTER LA NOTE DU DR. BECKER
                        </button>
                        <div id="doctor-loot-note" class="hidden doctor-loot-note-paper p-4 rounded-lg mt-3">
                            <p class="whitespace-pre-line">${zone.doctorLootNote}</p>
                        </div>
                    </div>
                `;

                if (lootLevel >= 2) {
                    doctorLootSectionHTML += `
                        <div class="amber-border bg-black p-4 rounded-lg mt-4">
                            <div class="text-amber-500 mb-2 text-lg">SECOND DOCUMENT DÉBLOQUÉ</div>
                            <button type="button" onclick="toggleDoctorLootNote2()" class="btn-retro px-4 py-2 text-xl font-bold rounded">
                                📄 CONSULTER LA LETTRE PERSONNELLE II
                            </button>
                            <div id="doctor-loot-note-2" class="hidden doctor-loot-note-paper p-4 rounded-lg mt-3">
                                <p class="whitespace-pre-line">${zone.doctorLootNote2}</p>
                            </div>
                        </div>
                    `;
                }
            }

            screen.innerHTML = `
                <div class="flex flex-col space-y-6">
                    <div class="border-b-2 border-amber-500 pb-3">
                        <div class="text-amber-500 text-lg">${globalData.title} &gt; ${zone.code}</div>
                        <h1 class="text-3xl md:text-4xl font-extrabold text-amber-300">${zone.name}</h1>
                    </div>

                    <div class="amber-border p-4 bg-amber-950 bg-opacity-20 rounded-lg">
                        <h2 class="text-xl font-bold text-amber-400 mb-1">DESCRIPTION VISUELLE DE LA ZONE :</h2>
                        <p class="text-2xl text-amber-100 leading-relaxed whitespace-pre-line">${zone.desc}</p>
                    </div>

                    ${doorSectionHTML}

                    <div>
                        <h2 class="text-2xl font-bold text-amber-400 mb-3 border-b border-amber-600 pb-1">
                            RAPPORTS ET LOGS DISPONIBLES :
                        </h2>
                        <div class="space-y-2">
                            ${reportsHTML}
                        </div>
                    </div>

                    ${lootSectionHTML}
                    ${doctorLootSectionHTML}
                </div>
            `;
            if (sync) publishGameState();
        }

//============================================================================================
// 4. DEFINITION DE L'ECRAN DETAIL D'UN RAPPORT
//============================================================================================
// Support de doctorNote et lecture des archives textuelles.
//============================================================================================
        function openReport(globalKey, subZoneId, reportId, sync = true) {
            if (sync && playerSession && !canModifyGame()) return;
            currentState.view = 'report_detail';
            currentState.currentGlobalKey = globalKey;
            currentState.currentZoneId = subZoneId;
            currentState.currentReportId = reportId;

            const globalData = DATA_ZONES[globalKey];
            const zone = globalData.zones.find(z => z.id === subZoneId);
            const report = zone.reports.find(r => r.id === reportId);

            const screen = document.getElementById('terminal-screen');

//============================================================================================
// AFFICHAGE DE LA NOTE CONFIDENTIELLE DU RAPPORT
//============================================================================================
            let doctorNoteHTML = '';
            if (report.doctorNote) {
                doctorNoteHTML = `
                    <div class="doctor-note-wrapper mt-6">
                        <button onclick="toggleDoctorNote()" class="btn-retro px-4 py-3 w-full text-left font-bold border-amber-500 text-amber-400 flex justify-between items-center hover:bg-amber-950 hover:text-amber-200 rounded">
                            <span>⚠️ [NOTE CONFIDENTIELLE DU MÉDECIN]</span>
                            <span id="note-toggle-icon" class="text-amber-300">[ + AFFICHER ]</span>
                        </button>
                        <div id="doctor-note-content" class="hidden doctor-note-box p-4 rounded-b-lg border-t-0 mt-1">
                            <p class="text-xl leading-relaxed whitespace-pre-line">${report.doctorNote}</p>
                        </div>
                    </div>
                `;
            }

            screen.innerHTML = `
                <div class="flex flex-col space-y-4">
                    <div class="border-b-2 border-amber-500 pb-2">
                        <div class="text-amber-500 text-sm md:text-base">${globalData.title} &gt; ${zone.code} &gt; ${report.code}</div>
                        <h1 class="text-3xl md:text-4xl font-bold text-amber-200">${report.title}</h1>
                        <div class="text-amber-400 text-lg mt-1">
                            <span>Auteur : ${report.author}</span> | <span>Date : ${report.date}</span>
                        </div>
                    </div>

                    <div class="amber-border p-6 bg-black rounded-lg min-h-[250px]">
                        <p class="text-2xl text-amber-100 leading-relaxed whitespace-pre-line">${report.text}</p>
                        ${doctorNoteHTML}
                    </div>

                    <div class="pt-2">
                        <button onclick="openSubZone('${globalKey}', '${subZoneId}')" class="btn-retro px-6 py-2 text-xl font-bold rounded">
                            &larr; RETOUR À LA LISTE DES RAPPORTS
                        </button>
                    </div>
                </div>
            `;
            if (sync) publishGameState();
        }

    //============================================================================================
    // OUVERTURE ET FERMETURE DE LA NOTE DU RAPPORT
    //============================================================================================
        function toggleDoctorNote() {
            const noteContent = document.getElementById('doctor-note-content');
            const toggleIcon = document.getElementById('note-toggle-icon');

            if (noteContent.classList.contains('hidden')) {
                noteContent.classList.remove('hidden');
                toggleIcon.innerText = '[ - MASQUER ]';
            } else {
                noteContent.classList.add('hidden');
                toggleIcon.innerText = '[ + AFFICHER ]';
            }
        }

//============================================================================================
// GESTION DU BUTIN ET DES NIVEAUX DE RECUPERATION
//============================================================================================
        function toggleLoot(subZoneId, groupId = 'main') {
            if (!canModifyGame()) return;
            const lootKey = groupId === 'main' ? subZoneId : `${subZoneId}:${groupId}`;

            if (Number.isInteger(currentState.unlockedLoot[lootKey])) {
                delete currentState.unlockedLoot[lootKey];
                openSubZone(currentState.currentGlobalKey, subZoneId);
                return;
            }

            if (currentState.lootInputZone === lootKey) {
                currentState.lootInputZone = null;
                openSubZone(currentState.currentGlobalKey, subZoneId);
                return;
            }

            currentState.lootInputZone = lootKey;
            openSubZone(currentState.currentGlobalKey, subZoneId);
        }

//============================================================================================
// AFFICHAGE DU POPUP DE DESCRIPTION D'UN LOOT
//============================================================================================
        function toggleLootTooltip(element, event) {
            if (event) {
                event.stopPropagation();
            }

            document.querySelectorAll('.loot-item.tooltip-open').forEach((item) => {
                if (item !== element) {
                    item.classList.remove('tooltip-open');
                }
            });

            element.classList.toggle('tooltip-open');
        }

    //============================================================================================
    // OUVERTURE ET FERMETURE DU PANNEAU DE FORCAGE
    //============================================================================================
        function toggleDoor(doorId) {
            if (!canModifyGame()) return;
            if ((currentState.doorRetryAt[doorId] || 0) > Date.now()) {
                return;
            }

            if (currentState.doorInputZone === doorId) {
                currentState.doorInputZone = null;
            } else {
                currentState.doorInputZone = doorId;
            }
            openSubZone(currentState.currentGlobalKey, currentState.currentZoneId);
        }

    //============================================================================================
    // VALIDATION DU NIVEAU DE FORCAGE DE LA PORTE
    //============================================================================================
        function setDoorLevel(doorId) {
            if (!canModifyGame()) return;
            const input = document.getElementById(`door-level-${doorId}`);
            const error = document.getElementById(`door-level-error-${doorId}`);
            const doorLevel = Number(input.value);

            if (!Number.isInteger(doorLevel) || doorLevel < 0 || doorLevel > 5) {
                error.classList.remove('hidden');
                input.focus();
                return;
            }

            const currentZone = DATA_ZONES[currentState.currentGlobalKey].zones.find(zone => zone.door && zone.door.name === doorId);
            const door = currentZone ? getDoorDefinition(currentZone.door) : null;
            const retryDelayMs = door ? getDoorRetryDelay(door, doorLevel) : 0;
            currentState.doorLevels[doorId] = doorLevel;
            currentState.doorRetryAt[doorId] = retryDelayMs > 0 ? Date.now() + retryDelayMs : 0;
            currentState.doorInputZone = null;
            openSubZone(currentState.currentGlobalKey, currentState.currentZoneId);
        }

    //============================================================================================
    // VALIDATION DU NIVEAU DE RECUPERATION DU BUTIN
    //============================================================================================
        function setLootLevel(subZoneId, groupId = 'main') {
            if (!canModifyGame()) return;
            const lootKey = groupId === 'main' ? subZoneId : `${subZoneId}:${groupId}`;
            const input = document.getElementById(`loot-level-${lootKey}`);
            const error = document.getElementById(`loot-level-error-${lootKey}`);
            const lootLevel = Number(input.value);

            if (!Number.isInteger(lootLevel) || lootLevel < 0 || lootLevel > 5) {
                error.classList.remove('hidden');
                input.focus();
                return;
            }

            currentState.unlockedLoot[lootKey] = lootLevel;
            currentState.lootInputZone = null;
            openSubZone(currentState.currentGlobalKey, subZoneId);
        }

    //============================================================================================
    // NOTES RECUPERABLES DANS LE BUTIN DU DR. BECKER
    //============================================================================================
        function toggleDoctorLootNote() {
            const note = document.getElementById('doctor-loot-note');
            if (note) {
                note.classList.toggle('hidden');
            }
        }

        function toggleDoctorLootNote2() {
            const note = document.getElementById('doctor-loot-note-2');
            if (note) {
                note.classList.toggle('hidden');
            }
        }

//============================================================================================
// NAVIGATION : RETOUR A L'ECRAN PRECEDENT
//============================================================================================
        function goBack() {
            if (currentState.view === 'report_detail') {
                openSubZone(currentState.currentGlobalKey, currentState.currentZoneId);
            } else if (currentState.view === 'zone_detail') {
                openGlobalZone(currentState.currentGlobalKey);
            } else if (currentState.view === 'global_zone') {
                showHomeScreen();
            }
        }
//============================================================================================
// INITIALISATION AU CHARGEMENT
//============================================================================================
        initializeSession();
    </script>
</body>
</html>
